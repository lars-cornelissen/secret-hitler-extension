<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto End Term</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      min-width: 240px;
      padding: 12px 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }
    .row {
      margin-top: 12px;
    }
    .row label {
      display: block;
      margin-bottom: 4px;
      cursor: default;
    }
    input[type="number"] {
      width: 80px;
      padding: 4px 6px;
      font-size: 14px;
    }
    .hint {
      color: #666;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Auto End Term</h1>
  <label>
    <input type="checkbox" id="enabled" />
    Auto-click "End Term"
  </label>
  <div class="row">
    <label for="delay">Delay before click (ms)</label>
    <input type="number" id="delay" min="0" step="100" />
  </div>
  <p class="hint">Waits this long after your "End Term" becomes active before clicking, so you can see the new card state. Only stays active once per turn.</p>
  <script src="popup.js"></script>
</body>
</html>
